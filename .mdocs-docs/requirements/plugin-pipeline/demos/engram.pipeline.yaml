# Engram — 系统自带流水线 DEMO（与 bundled 同源语义）

id: engram
name: Engram
kind: system
runtime: engram
data_key: engram
version: "3.6.0"
description: >
  本机 Agent 记忆（单二进制 + SQLite）。安装后按需拉起，非常驻服务。
outputs:
  - mcp

probe:
  - type: file_exists
    path: bin/engram

steps:
  - type: download
    # url 留空：Engram 由系统按平台选镜像包

  - type: extract
    dest: bin

  - type: exec
    command: bin/engram
    args:
      - init
      - mdocs-bootstrap
      - --force
    cwd: "{{plugins_data}}/workspace"
    when: probe_failed

  - type: upsert_mcp
    mcp_server_id: engram
    name: Engram
    enabled: true
    transport: stdio
    command: bin/engram
    args:
      - mcp

  - type: write_soul_sidecar
    scope: tenant
    file: engram.md
    content: |
      # Engram

      本机记忆已接入。空间按当前访客隔离，无需也不应切换他人记忆。

uninstall:
  - type: delete_soul_sidecar
    scope: tenant
    file: engram.md
  - type: remove_mcp
    mcp_server_id: engram
